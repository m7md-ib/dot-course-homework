<!doctype html>
<html>
  <head>
    <title>Employee Registration Form</title>

    <style>
      .container {
        width: 500px;
        margin: 0 auto;
      }
      .row {
        margin-bottom: 10px;
      }

      label {
        display: inline-block;
        width: 150px;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <img src="businessman.png" style="display: inline; width: 50px" alt="" />
      <h1 style="color: red; display: inline">Employee Registration Form</h1>

      <form>
        <div class="row">
          <label></label>
          <input type="radio" name="title" checked /> Mr.
          <input type="radio" name="title" /> Mrs.
          <input type="radio" name="title" /> Ms.
        </div>

        <div class="row">
          <label>First Name</label>
          <input type="text" placeholder="First Name" />
        </div>

        <div class="row">
          <label>Last Name</label>
          <input type="text" placeholder="Last Name" />
        </div>

        <div class="row">
          <label>Mail Address1</label>
          <input type="text" />
        </div>

        <div class="row">
          <label>Mail Address2</label>
          <input type="text" />
        </div>

        <div class="row">
          <label>City</label>
          <input type="text" />
        </div>

        <div class="row">
          <label>State</label>
          <select>
            <option>Gujarat</option>
            <option>Delhi</option>
            <option>Mumbai</option>
          </select>
        </div>

        <div class="row">
          <label>Zip</label>
          <input type="text" />
        </div>

        <div class="row">
          <label>Upload Photo</label>
          <input type="file" />
        </div>

        <div class="row">
          <label>E-Mail</label>
          <input type="email" style="width: 200px" />
        </div>

        <div class="row">
          <label>Mobile</label>
          <input type="text" value="+91" />
        </div>

        <div class="row">
          <label>Languages known</label>
          <input type="checkbox" checked /> Gujarati
          <br />
          <label></label>
          <input type="checkbox" checked /> Hindi
          <br />
          <label></label>
          <input type="checkbox" checked /> English
          <br />
          <label></label>
          <input type="checkbox" /> Marathi
        </div>

        <div
          class="row"
          style="display: flex; justify-content: space-between; width: 320px"
          ;
        >
          <label
            style="display: flex; justify-content: center; align-items: center"
            >Additional Information</label
          >
          <textarea placeholder="Optional"></textarea>
        </div>

        <div class="buttons">
          <label></label>
          <input type="submit" value="submit" />
          <input type="reset" value="reset" />
        </div>
      </form>
    </div>
  </body>
</html>
