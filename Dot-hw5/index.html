<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div>
      <form>
        <label for="inp1">First Name:</label>
        <input type="text" id="inp1" name="inp1" placeholder="Your name" />
        <label for="inp2">Last Name:</label>
        <input type="text" id="inp2" name="inp2" placeholder="Your last name" />

        <label for="country">Country:</label>
        <select name="country" id="country">
          <option value="1">Australia</option>
          <option value="2" selected>Jordan</option>
          <option value="3">United States</option>
        </select>
        <button type="submit">Submit</button>
      </form>
    </div>
  </body>
</html>
